x-ai-engine-env: &ai-engine-env
  APP_ENV: ${APP_ENV:-production}
  APP_PORT: ${APP_PORT:-8002}
  ROOT_PATH: ${ROOT_PATH:-/gaim}
  SECRET_KEY: ${SECRET_KEY:-replace-with-random-secret}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["https://your-frontend.example.com"]}
  WAS_BASE_URL: ${WAS_BASE_URL:-https://your-was.example.com}
  WAS_INTERNAL_TOKEN: ${WAS_INTERNAL_TOKEN:-change-this-internal-token}
  WAS_CALLBACK_TIMEOUT_SEC: ${WAS_CALLBACK_TIMEOUT_SEC:-1.0}
  AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-live}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_PROVIDER_TIMEOUT_SEC: ${OPENAI_PROVIDER_TIMEOUT_SEC:-60}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_AUTH_MODE: ${GOOGLE_AUTH_MODE:-api_key}
  GOOGLE_PROVIDER_TIMEOUT_MS: ${GOOGLE_PROVIDER_TIMEOUT_MS:-60000}
  GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
  GCP_LOCATION: ${GCP_LOCATION:-us-central1}
  GCP_SERVICE_ACCOUNT_JSON: ${GCP_SERVICE_ACCOUNT_JSON:-}
  RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
  RUNWAY_REQUEST_TIMEOUT_SEC: ${RUNWAY_REQUEST_TIMEOUT_SEC:-30}
  RUNWAY_DOWNLOAD_TIMEOUT_SEC: ${RUNWAY_DOWNLOAD_TIMEOUT_SEC:-60}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_BASE_DIR: ${STORAGE_BASE_DIR:-storage-data}
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-https://your-ai-engine.example.com/generated}
  LOCAL_STORAGE_RETENTION_SECONDS: ${LOCAL_STORAGE_RETENTION_SECONDS:-604800}
  MAX_IMAGE_REFERENCE_BYTES: ${MAX_IMAGE_REFERENCE_BYTES:-10485760}
  MAX_VIDEO_INPUT_IMAGE_BYTES: ${MAX_VIDEO_INPUT_IMAGE_BYTES:-10485760}
  REFERENCE_IMAGE_DOWNLOAD_TIMEOUT_SEC: ${REFERENCE_IMAGE_DOWNLOAD_TIMEOUT_SEC:-20}
  REDIS_URL: ${REDIS_URL:-redis://redis-host:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis-host:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis-host:6379/1}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
  CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-660}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-720}
  CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-3600}
  CELERY_BROKER_VISIBILITY_TIMEOUT: ${CELERY_BROKER_VISIBILITY_TIMEOUT:-900}
  CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: ${CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP:-true}
  CELERY_TASK_ACKS_LATE: ${CELERY_TASK_ACKS_LATE:-true}
  CELERY_TASK_REJECT_ON_WORKER_LOST: ${CELERY_TASK_REJECT_ON_WORKER_LOST:-true}
  CELERY_TASK_ACKS_ON_FAILURE_OR_TIMEOUT: ${CELERY_TASK_ACKS_ON_FAILURE_OR_TIMEOUT:-true}
  CELERY_TASK_RETRY_ENABLED: ${CELERY_TASK_RETRY_ENABLED:-false}
  CELERY_TASK_RETRY_COUNTDOWN: ${CELERY_TASK_RETRY_COUNTDOWN:-15}
  CELERY_JOB_LOCK_TTL: ${CELERY_JOB_LOCK_TTL:-900}
  CELERY_JOB_LOCK_ENABLED: ${CELERY_JOB_LOCK_ENABLED:-true}
  JOB_STATUS_TTL_SECONDS: ${JOB_STATUS_TTL_SECONDS:-43200}
  VIDEO_MAX_WAIT_SEC: ${VIDEO_MAX_WAIT_SEC:-600}

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *ai-engine-env
    ports:
      - "${APP_PORT:-8002}:8002"
    restart: unless-stopped

  image-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *ai-engine-env
      CELERY_QUEUES: image-queue
      CELERY_WORKER_CONCURRENCY: ${CELERY_IMAGE_WORKER_CONCURRENCY:-5}
      CELERY_WORKER_NAME: ai-image-worker@%h
    restart: unless-stopped

  video-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *ai-engine-env
      CELERY_QUEUES: video-queue
      CELERY_WORKER_CONCURRENCY: ${CELERY_VIDEO_WORKER_CONCURRENCY:-1}
      CELERY_WORKER_NAME: ai-video-worker@%h
    restart: unless-stopped
